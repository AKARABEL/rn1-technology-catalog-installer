name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Syntax
        run: bash -n rn1-technology-catalog-installer.sh && dash -c 'exit 0'
      - name: catalog.sh is an identical copy (update address of older installations)
        run: cmp catalog.sh rn1-technology-catalog-installer.sh && test -x catalog.sh && test -x rn1-technology-catalog-installer.sh
      - name: Generator, menu and Catalog versions
        run: bash tests/run_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Updates and offline bundle
        run: bash tests/run_bundle_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Snapshots, API keys and import
        run: bash tests/run_snapshot_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Guided upgrade
        run: bash tests/run_upgrade_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Installer self-update
        run: bash tests/run_selfupdate_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Take over an existing installation
        run: bash tests/run_adopt_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Background jobs, cancel and the full screen menu
        run: bash tests/run_jobs_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Time zone and job times
        run: bash tests/run_timezone_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Guided tasks install, update and remove
        run: bash tests/run_wizard_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Podman install and the hints of the distribution, macOS flows
        run: bash tests/run_distro_tests.sh "$PWD/rn1-technology-catalog-installer.sh"

  distributions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "RHEL 10 (UBI)", image: "registry.access.redhat.com/ubi10/ubi" }
          - { name: "RHEL 9 (UBI)", image: "registry.access.redhat.com/ubi9/ubi" }
          - { name: "RHEL 8 (UBI), bash 4.4", image: "registry.access.redhat.com/ubi8/ubi" }
          - { name: "CentOS 7, bash 4.2", image: "centos:7" }
          - { name: "CentOS Stream 9", image: "quay.io/centos/centos:stream9" }
          - { name: "Rocky Linux 9", image: "rockylinux/rockylinux:9" }
          - { name: "AlmaLinux 9", image: "almalinux:9" }
          - { name: "Debian 12", image: "debian:12" }
          - { name: "openSUSE Leap 15.6", image: "opensuse/leap:15.6" }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: All suites as a normal user
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/run_in_container.sh

  e2e-podman:
    name: Catalog on real Podman (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Room and settings for the stack (disk, vm.max_map_count, no Docker)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo sysctl -w vm.max_map_count=262144
          sudo systemctl disable --now docker.service docker.socket || true
          df -h /
      - name: Installer in its own folder
        run: |
          mkdir -p "$RUNNER_TEMP/rn1"
          cp rn1-technology-catalog-installer.sh "$RUNNER_TEMP/rn1/"
          sed -i 's/^CHECK_FOR_UPDATES=.*/CHECK_FOR_UPDATES="false"/; s/^HEALTH_TIMEOUT=.*/HEALTH_TIMEOUT="1500"/' "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh"
      - name: install-podman (Podman, socket, restart service, newest Docker Compose)
        run: sudo bash "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh" install-podman
      - name: The newest Docker Compose release is the provider
        run: |
          tag="$(curl -fsSI https://github.com/docker/compose/releases/latest | tr -d '\r' | sed -n 's#^[Ll]ocation: .*/tag/##p')"
          have="$(sudo /usr/local/lib/docker/cli-plugins/docker-compose version --short)"
          echo "newest $tag, installed $have"
          [ "v${have#v}" = "$tag" ]
          systemctl is-active podman.socket
          systemctl is-enabled podman-restart.service
      - name: setup (generate and start)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh setup </dev/null
      - name: health (every service runs, Catalog Web answers)
        timeout-minutes: 30
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh health 1500
      - name: check (option 16)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh check
      - name: Containers carry the compose labels the installer relies on
        run: |
          cd "$RUNNER_TEMP/rn1"
          want="$(sudo env PODMAN_COMPOSE_PROVIDER=/usr/local/lib/docker/cli-plugins/docker-compose podman compose --env-file .env -f docker-compose.yml config --services | sort | tr '\n' ' ')"
          have="$(sudo podman ps -q --filter label=com.docker.compose.project=rn1 | xargs sudo podman container inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' | sort | tr '\n' ' ')"
          echo "want: $want"; echo "have: $have"
          [ "$want" = "$have" ]
      - name: down and up again - the data volumes stay
        run: |
          cd "$RUNNER_TEMP/rn1"
          sudo bash rn1-technology-catalog-installer.sh down </dev/null
          sudo podman volume exists rn1_db_data
          sudo bash rn1-technology-catalog-installer.sh up </dev/null
          timeout 1800 sudo bash rn1-technology-catalog-installer.sh health 1500
      - name: Diagnostics
        if: failure() || cancelled()
        run: |
          cd "$RUNNER_TEMP/rn1" || exit 0
          sudo podman ps -a || true
          sudo podman ps -aq | xargs -r sudo podman container inspect --format '{{.Name}} {{.State.Status}} health={{with .State.Health}}{{.Status}}{{end}} restarts={{.RestartCount}} exit={{.State.ExitCode}} {{.State.Error}}' || true
          curl -sS -o /dev/null -w 'Catalog Web: HTTP %{http_code}\n' --max-time 10 http://localhost:8080/ || true
          free -m; df -h /
          sudo env PODMAN_COMPOSE_PROVIDER=/usr/local/lib/docker/cli-plugins/docker-compose podman compose --env-file .env -f docker-compose.yml logs --tail=80 || true
          journalctl -u podman.socket --no-pager | tail -n 50 || true

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The macOS bash 3.2 is refused with a clear message (before Homebrew bash is used)
        run: |
          out="$(env RN1_BASH_REEXEC=1 /bin/bash rn1-technology-catalog-installer.sh help 2>&1)" && exit 1
          echo "$out"
          grep -q "bash 4.2 or newer is needed" <<< "$out"
      - name: Homebrew bash and the GNU tools
        run: |
          brew install bash coreutils gnu-sed grep findutils
          p="$(brew --prefix)"
          for t in coreutils gnu-sed grep findutils; do echo "$p/opt/$t/libexec/gnubin" >> "$GITHUB_PATH"; done
          echo "$p/bin" >> "$GITHUB_PATH"
      - name: /bin/bash starts the installer in Homebrew bash
        run: /bin/bash rn1-technology-catalog-installer.sh help | head -n 5
      - name: Syntax
        run: bash -n rn1-technology-catalog-installer.sh
      - name: Podman install and macOS flows (fake Homebrew, Podman machine, GitHub)
        run: bash tests/run_distro_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
