name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax
        run: bash -n catalog.sh && dash -c 'exit 0'
      - name: Generator, menu and Catalog versions
        run: bash tests/run_tests.sh "$PWD/catalog.sh"
      - name: Updates and offline bundle
        run: bash tests/run_bundle_tests.sh "$PWD/catalog.sh"
      - name: Snapshots, API keys and import
        run: bash tests/run_snapshot_tests.sh "$PWD/catalog.sh"
      - name: Guided upgrade
        run: bash tests/run_upgrade_tests.sh "$PWD/catalog.sh"
      - name: Installer self-update
        run: bash tests/run_selfupdate_tests.sh "$PWD/catalog.sh"
      - name: Take over an existing installation
        run: bash tests/run_adopt_tests.sh "$PWD/catalog.sh"
