name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Syntax
        run: bash -n rn1-technology-catalog-installer.sh && dash -c 'exit 0'
      - name: catalog.sh is an identical copy (update address of older installations)
        run: cmp catalog.sh rn1-technology-catalog-installer.sh && test -x catalog.sh && test -x rn1-technology-catalog-installer.sh
      - name: Generator, menu and Catalog versions
        run: bash tests/run_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Updates and offline bundle
        run: bash tests/run_bundle_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Snapshots, API keys and import
        run: bash tests/run_snapshot_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Guided upgrade
        run: bash tests/run_upgrade_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Installer self-update
        run: bash tests/run_selfupdate_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Take over an existing installation
        run: bash tests/run_adopt_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Background jobs, cancel and the full screen menu
        run: bash tests/run_jobs_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Time zone and job times
        run: bash tests/run_timezone_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Guided tasks install, update and remove
        run: bash tests/run_wizard_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Podman and Docker install and the hints of the distribution, macOS flows
        run: bash tests/run_distro_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Docker as the container engine, one engine per server
        run: bash tests/run_docker_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Version series, recommended versions and the versions screen
        run: bash tests/run_versions_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Domain, Nginx Proxy Manager and Let's Encrypt
        run: bash tests/run_domain_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: License, activation and the host name of catalog-web
        run: bash tests/run_license_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Memory of the engine, the cache of MongoDB and out-of-memory stops
        run: bash tests/run_memory_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
      - name: Internet access, the proxy questions and the proxy of the package managers
        run: bash tests/run_network_tests.sh "$PWD/rn1-technology-catalog-installer.sh"

  distributions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "RHEL 10 (UBI)", image: "registry.access.redhat.com/ubi10/ubi" }
          - { name: "RHEL 9 (UBI)", image: "registry.access.redhat.com/ubi9/ubi" }
          - { name: "RHEL 8 (UBI), bash 4.4", image: "registry.access.redhat.com/ubi8/ubi" }
          - { name: "CentOS 7, bash 4.2", image: "centos:7" }
          - { name: "CentOS Stream 9", image: "quay.io/centos/centos:stream9" }
          - { name: "Rocky Linux 9", image: "rockylinux/rockylinux:9" }
          - { name: "AlmaLinux 9", image: "almalinux:9" }
          - { name: "Debian 12", image: "debian:12" }
          - { name: "openSUSE Leap 15.6", image: "opensuse/leap:15.6" }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: All suites as a normal user
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/run_in_container.sh

  e2e-podman:
    name: Catalog on real Podman (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Room and settings for the stack (disk, vm.max_map_count, no Docker)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo sysctl -w vm.max_map_count=262144
          sudo systemctl disable --now docker.service docker.socket || true
          df -h /
      - name: Installer in its own folder
        run: |
          mkdir -p "$RUNNER_TEMP/rn1"
          cp rn1-technology-catalog-installer.sh "$RUNNER_TEMP/rn1/"
          sed -i 's/^CHECK_FOR_UPDATES=.*/CHECK_FOR_UPDATES="false"/; s/^HEALTH_TIMEOUT=.*/HEALTH_TIMEOUT="1500"/; s/^CONTAINER_ENGINE=.*/CONTAINER_ENGINE="podman"/' "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh"
      - name: install-podman (Podman, socket, restart service, newest Docker Compose)
        run: sudo bash "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh" install-podman
      - name: The newest Docker Compose release is the provider
        run: |
          tag="$(curl -fsSI https://github.com/docker/compose/releases/latest | tr -d '\r' | sed -n 's#^[Ll]ocation: .*/tag/##p')"
          have="$(sudo /usr/local/lib/docker/cli-plugins/docker-compose version --short)"
          echo "newest $tag, installed $have"
          [ "v${have#v}" = "$tag" ]
          systemctl is-active podman.socket
          systemctl is-enabled podman-restart.service
      - name: setup (generate and start)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh setup </dev/null
      - name: health (every service runs, Catalog Web answers)
        timeout-minutes: 30
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh health 1500
      - name: check (option 16)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh check
      - name: Containers carry the compose labels the installer relies on
        run: |
          cd "$RUNNER_TEMP/rn1"
          want="$(sudo env PODMAN_COMPOSE_PROVIDER=/usr/local/lib/docker/cli-plugins/docker-compose podman compose --env-file .env -f docker-compose.yml config --services | sort | tr '\n' ' ')"
          have="$(sudo podman ps -q --filter label=com.docker.compose.project=rn1 | xargs sudo podman container inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' | sort | tr '\n' ' ')"
          echo "want: $want"; echo "have: $have"
          [ "$want" = "$have" ]
      - name: down and up again - the data volumes stay
        run: |
          cd "$RUNNER_TEMP/rn1"
          sudo bash rn1-technology-catalog-installer.sh down </dev/null
          sudo podman volume exists rn1_db_data
          sudo bash rn1-technology-catalog-installer.sh up </dev/null
          timeout 1800 sudo bash rn1-technology-catalog-installer.sh health 1500
      - name: Diagnostics
        if: failure() || cancelled()
        run: |
          cd "$RUNNER_TEMP/rn1" || exit 0
          sudo podman ps -a || true
          sudo podman ps -aq | xargs -r sudo podman container inspect --format '{{.Name}} {{.State.Status}} health={{with .State.Health}}{{.Status}}{{end}} restarts={{.RestartCount}} exit={{.State.ExitCode}} {{.State.Error}}' || true
          curl -sS -o /dev/null -w 'Catalog Web: HTTP %{http_code}\n' --max-time 10 http://localhost:8080/ || true
          free -m; df -h /
          sudo env PODMAN_COMPOSE_PROVIDER=/usr/local/lib/docker/cli-plugins/docker-compose podman compose --env-file .env -f docker-compose.yml logs --tail=80 || true
          journalctl -u podman.socket --no-pager | tail -n 50 || true

  e2e-docker:
    name: Catalog on real Docker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Room and settings for the stack (disk, vm.max_map_count)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo sysctl -w vm.max_map_count=262144
          df -h /
      - name: Installer in its own folder, CONTAINER_ENGINE docker
        run: |
          mkdir -p "$RUNNER_TEMP/rn1"
          cp rn1-technology-catalog-installer.sh "$RUNNER_TEMP/rn1/"
          sed -i 's/^CHECK_FOR_UPDATES=.*/CHECK_FOR_UPDATES="false"/; s/^HEALTH_TIMEOUT=.*/HEALTH_TIMEOUT="1500"/; s/^CONTAINER_ENGINE=.*/CONTAINER_ENGINE="docker"/' "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh"
      - name: install-docker (the runner has Docker - its daemon and Compose are checked)
        run: sudo bash "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh" install-docker
      - name: Docker runs, its daemon starts after a reboot, Compose is there
        run: |
          systemctl is-active docker
          systemctl is-enabled docker
          sudo docker compose version
      - name: setup (generate and start)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh setup </dev/null
      - name: health (every service runs, Catalog Web answers)
        timeout-minutes: 30
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh health 1500
      - name: check (option 16)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh check
      - name: Containers carry the compose labels the installer relies on
        run: |
          cd "$RUNNER_TEMP/rn1"
          want="$(sudo docker compose --env-file .env -f docker-compose.yml config --services | sort | tr '\n' ' ')"
          have="$(sudo docker ps -q --filter label=com.docker.compose.project=rn1 | xargs sudo docker container inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' | sort | tr '\n' ' ')"
          echo "want: $want"; echo "have: $have"
          [ "$want" = "$have" ]
      - name: down and up again - the data volumes stay
        run: |
          cd "$RUNNER_TEMP/rn1"
          sudo bash rn1-technology-catalog-installer.sh down </dev/null
          sudo docker volume inspect rn1_db_data >/dev/null
          sudo bash rn1-technology-catalog-installer.sh up </dev/null
          timeout 1800 sudo bash rn1-technology-catalog-installer.sh health 1500
      - name: Diagnostics
        if: failure() || cancelled()
        run: |
          cd "$RUNNER_TEMP/rn1" || exit 0
          sudo docker ps -a || true
          sudo docker ps -aq | xargs -r sudo docker container inspect --format '{{.Name}} {{.State.Status}} health={{with .State.Health}}{{.Status}}{{end}} restarts={{.RestartCount}} exit={{.State.ExitCode}} {{.State.Error}}' || true
          curl -sS -o /dev/null -w 'Catalog Web: HTTP %{http_code}\n' --max-time 10 http://localhost:8080/ || true
          free -m; df -h /
          sudo docker compose --env-file .env -f docker-compose.yml logs --tail=80 || true
          journalctl -u docker --no-pager | tail -n 50 || true

  e2e-proxy:
    name: Catalog through a proxy with a login (Podman, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Room and settings for the stack (disk, vm.max_map_count, no Docker)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo sysctl -w vm.max_map_count=262144
          sudo systemctl disable --now docker.service docker.socket || true
      - name: squid with a Basic login - the only way out for root and apt (HTTP and HTTPS)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq squid >/dev/null
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "PROXY_PW=$pw" >> "$GITHUB_ENV"
          printf 'ci:%s\n' "$(openssl passwd -apr1 "$pw")" | sudo tee /etc/squid/passwd >/dev/null
          sudo chown root:proxy /etc/squid/passwd
          sudo chmod 640 /etc/squid/passwd
          sudo tee /etc/squid/squid.conf >/dev/null <<'EOF'
          auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
          auth_param basic realm rn1-ci
          acl authed proxy_auth REQUIRED
          acl SSL_ports port 443
          acl Safe_ports port 80 443
          acl CONNECT method CONNECT
          http_access deny !Safe_ports
          http_access deny CONNECT !SSL_ports
          http_access allow authed
          http_access deny all
          http_port 3128
          visible_hostname rn1-ci
          cache deny all
          access_log daemon:/var/log/squid/access.log squid
          EOF
          sudo systemctl restart squid
          # the runner itself (its own user) keeps talking to GitHub; root and apt's _apt may only use squid
          for t in iptables ip6tables; do
            for u in root _apt; do
              sudo "$t" -A OUTPUT -p tcp -m multiport --dports 80,443 -m owner --uid-owner "$u" -j REJECT
            done
          done
          if sudo curl -sS --noproxy '*' --max-time 10 -o /dev/null https://registry-1.docker.io/v2/; then
            echo "root still goes out directly"; exit 1
          fi
      - name: Installer in its own folder - INTERNET_PROXY and its login (.proxy_login, mode 600)
        run: |
          mkdir -p "$RUNNER_TEMP/rn1"
          cp rn1-technology-catalog-installer.sh "$RUNNER_TEMP/rn1/"
          ip="$(hostname -I | awk '{print $1}')"
          sed -i "s/^CHECK_FOR_UPDATES=.*/CHECK_FOR_UPDATES=\"false\"/; s/^CONTAINER_ENGINE=.*/CONTAINER_ENGINE=\"podman\"/; s|^INTERNET_PROXY=.*|INTERNET_PROXY=\"http://$ip:3128\"|" "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh"
          (umask 077 && printf 'ci:%s\n' "$PROXY_PW" > "$RUNNER_TEMP/rn1/.proxy_login")
      - name: network-check through the proxy (no questions, exit 0)
        run: sudo bash "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh" network-check
      - name: install-podman through the proxy (packages, Docker Compose, the drop-in of podman.service)
        run: |
          sudo bash "$RUNNER_TEMP/rn1/rn1-technology-catalog-installer.sh" install-podman
          [ "$(sudo stat -c %a /etc/rn1-technology-catalog/engine-proxy.env)" = 600 ]
          systemctl show podman.service -p EnvironmentFiles | grep -q /etc/rn1-technology-catalog/engine-proxy.env
          grep -q '^http_proxy = false$' /etc/containers/containers.conf.d/50-rn1-proxy.conf
          if sudo grep -rqF "$PROXY_PW" /etc/apt /etc/environment /var/log/apt /etc/systemd/system/podman.service.d; then
            echo "the proxy password is in a configuration or log file"; exit 1
          fi
      - name: setup through the proxy (generate, pull, start)
        run: cd "$RUNNER_TEMP/rn1" && sudo bash rn1-technology-catalog-installer.sh setup </dev/null
      - name: The pulls went through squid with the login; only catalog-web and Nginx Proxy Manager have the proxy (the others have it empty)
        run: |
          sudo awk '{ print $6, $7, $8 }' /var/log/squid/access.log | sort | uniq -c | sort -rn | head -n 30
          sudo grep -q 'CONNECT registry-1.docker.io:443 ci ' /var/log/squid/access.log
          sudo grep -q 'CONNECT ghcr.io:443 ci ' /var/log/squid/access.log
          n=0
          for c in $(sudo podman ps -aq --filter label=com.docker.compose.project=rn1); do
            svc="$(sudo podman container inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$c")"
            env="$(sudo podman container inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$c")"
            case "$svc" in
              catalog-web|nginx-proxy-manager)
                grep -q '^HTTPS_PROXY=http://ci:' <<< "$env" || { echo "$svc has no proxy"; exit 1; }
                grep -qx 'HTTP_PROXY=' <<< "$env" || { echo "$svc has an HTTP proxy"; exit 1; }
                n=$((n + 1))
                ;;
              *)
                if grep -qiE '_proxy=.+' <<< "$env"; then echo "$svc has a proxy"; exit 1; fi
                ;;
            esac
          done
          [ "$n" -eq 2 ]
      - name: Diagnostics
        if: failure() || cancelled()
        run: |
          sudo tail -n 60 /var/log/squid/access.log || true
          sudo podman ps -a || true
          journalctl -u podman.service --no-pager | tail -n 50 || true
          sudo iptables -S OUTPUT || true

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The macOS bash 3.2 is refused with a clear message (before Homebrew bash is used)
        run: |
          out="$(env RN1_MAC_BOOTSTRAPPED=1 RN1_BASH_REEXEC=1 /bin/bash rn1-technology-catalog-installer.sh help 2>&1)" && exit 1
          echo "$out"
          grep -q "bash 4.2 or newer is needed" <<< "$out"
      - name: The start check in bash 3.2 without a terminal - names what is missing and installs nothing, or starts
        run: |
          rc=0
          out="$(/bin/bash rn1-technology-catalog-installer.sh help < /dev/null 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            grep -q "^Usage:" <<< "$out"
          else
            grep -q "Homebrew installs what the installer needs here:" <<< "$out" && grep -q "Nothing was installed" <<< "$out"
          fi
      - name: Homebrew bash and the GNU tools
        run: |
          brew install bash coreutils gnu-sed grep findutils
          p="$(brew --prefix)"
          for t in coreutils gnu-sed grep findutils; do echo "$p/opt/$t/libexec/gnubin" >> "$GITHUB_PATH"; done
          echo "$p/bin" >> "$GITHUB_PATH"
      - name: /bin/bash 3.2 runs the start check, finds everything and starts the installer in Homebrew bash
        run: |
          out="$(/bin/bash rn1-technology-catalog-installer.sh help < /dev/null 2>&1)"
          head -n 5 <<< "$out"
          grep -q "^Usage:" <<< "$out" && ! grep -q "Homebrew installs" <<< "$out"
      - name: Syntax
        run: bash -n rn1-technology-catalog-installer.sh
      - name: Podman, Docker Desktop and Colima flows (fake Homebrew, Podman machine, Colima, GitHub)
        run: bash tests/run_distro_tests.sh "$PWD/rn1-technology-catalog-installer.sh"
